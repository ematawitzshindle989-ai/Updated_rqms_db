<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RQMS — Queue Display Monitor</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="display-page">
  <a href="dashboard.html" class="back-link">&larr; Back to Dashboard</a>

  <header class="display-header">
    <h1>ST. PAUL HOSPITAL — RADIOLOGY</h1>
    <p class="display-clock" id="lblClock">00:00:00</p>
  </header>

  <div class="display-main">
    <section>
      <p class="now-label">NOW SERVING</p>
      <p class="now-number" id="lblNowNumber">R-104</p>
      <p class="now-room" id="lblNowRoom">Please proceed to Room 4</p>

      <div class="display-upcoming" style="margin-top:48px;">
        <h2>UPCOMING</h2>
        <ul id="lstUpcoming"></ul>
      </div>
    </section>

    <aside>
      <div class="qr-box">QR</div>
      <p class="qr-hint">Scan QR on slip to track queue on mobile</p>
    </aside>
  </div>

  <script src="js/database.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
